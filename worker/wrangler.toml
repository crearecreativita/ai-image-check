name = "ai-image-check"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Dominio del frontend (solo schema + host, senza path). Modificalo dopo aver pubblicato su GitHub Pages.
[vars]
ALLOWED_ORIGIN = "https://aicheck.crearecreativita.it,https://crearecreativita.github.io"

# Crea il namespace con: npx wrangler kv namespace create CACHE
# poi incolla qui l'id restituito.
[[kv_namespaces]]
binding = "CACHE"
id = "152bcfcfcdfe424089a0ee7783ff7bb8"

# Secret (NON qui): npx wrangler secret put SIGHTENGINE_USER / SIGHTENGINE_SECRET
